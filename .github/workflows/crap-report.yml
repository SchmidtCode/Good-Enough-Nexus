name: Production CRAP report

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
  schedule:
    - cron: "43 9 * * 1"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Measure production CRAP
        run: node tools/crap-report.js --coverage --runtime luajit --output-dir crap-results

      - name: Publish CRAP summary
        if: ${{ always() && hashFiles('crap-results/summary.md') != '' }}
        run: cat crap-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CRAP observations
        if: ${{ always() && hashFiles('crap-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: production-crap-${{ github.sha }}
          path: crap-results/
          retention-days: 30
