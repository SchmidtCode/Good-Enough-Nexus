name: Performance benchmarks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 9 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Run performance benchmarks
        run: node tools/run-performance-benchmarks.js --runtime luajit --output-dir benchmark-results

      - name: Publish benchmark summary
        if: ${{ always() && hashFiles('benchmark-results/summary.md') != '' }}
        run: cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark observations
        if: ${{ always() && hashFiles('benchmark-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-benchmarks-${{ github.sha }}
          path: benchmark-results/
          retention-days: 30
