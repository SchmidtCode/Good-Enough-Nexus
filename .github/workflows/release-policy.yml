name: Release policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify license and release policy
        shell: pwsh
        run: ./tools/Test-ReleasePolicy.ps1